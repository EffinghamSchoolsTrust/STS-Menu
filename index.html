<script>
const menus = {
    1: "Monday.jpg",
    2: "Tuesday.jpg",
    3: "Wednesday.jpg",
    4: "Thursday.jpg",
    5: "Friday.jpg",
    6: "Saturday.jpg",
    0: "Sunday.jpg"
};

const ukTime = new Date(
    new Date().toLocaleString("en-GB", {
        timeZone: "Europe/London"
    })
);

let day = ukTime.getDay();

if (ukTime.getHours() >= 14) {
    day = (day + 1) % 7;
}

document.getElementById("menu").src = menus[day];
</script>
