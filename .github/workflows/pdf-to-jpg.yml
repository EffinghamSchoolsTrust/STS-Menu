name: PDF to JPG

on:
  push:
    paths:
      - 'pdfs/*.pdf'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Convert PDFs
        run: |
          mkdir -p menus

          for pdf in pdfs/*.pdf
          do
            name=$(basename "$pdf" .pdf)

            pdftoppm \
              -jpeg \
              -singlefile \
              "$pdf" \
              "menus/$name"
          done

      - name: Commit changes
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

          git add menus/

          git diff --staged --quiet || git commit -m "Update menu images"

          git push
