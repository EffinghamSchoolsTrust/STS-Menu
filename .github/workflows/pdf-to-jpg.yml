name: PDF to JPG

on:
  push:
    paths:
      - 'pdfs/*.pdf'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Convert PDFs
        run: |
          mkdir -p menus

          for pdf in pdfs/*.pdf
          do
            name=$(basename "$pdf" .pdf)

            pdftoppm \
              -jpeg \
              -singlefile \
              -scale-to 1920 \
              "$pdf" \
              "menus/$name"
          done

      - name: Commit JPGs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add menus/*.jpg

          git commit -m "Auto-convert PDFs to JPG" || exit 0
          git push
